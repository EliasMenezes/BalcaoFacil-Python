<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Balcão Fácil – Entrar</title><style>body{font:15px system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:grid;place-items:center;min-height:100vh;margin:0}form,.b{background:#1e293b;padding:28px;border-radius:12px;width:min(92vw,360px)}h1{margin:0 0 16px;font-size:20px}input,select{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;font:inherit}button{width:100%;padding:11px;border:0;border-radius:8px;background:#0284c7;color:#fff;font:600 15px system-ui;cursor:pointer}.e{color:#fca5a5;min-height:20px}a{color:#7dd3fc}li{margin:6px 0}</style>
<form id=f><h1>Balcão Fácil – Entrar</h1><label>Usuário<input id=u autofocus autocomplete=username></label><label>Senha<input id=p type=password autocomplete=current-password></label><div class=e id=e></div><button>Entrar</button></form>
<script>f.onsubmit=async function(ev){ev.preventDefault();var r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u.value,pass:p.value})});if(r.ok)location.href="/";else e.textContent=(await r.json()).error}</script>
