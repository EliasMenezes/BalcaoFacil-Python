<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Balcão Fácil – Primeiro acesso</title><style>body{font:15px system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:grid;place-items:center;min-height:100vh;margin:0}form,.b{background:#1e293b;padding:28px;border-radius:12px;width:min(92vw,360px)}h1{margin:0 0 16px;font-size:20px}input,select{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;font:inherit}button{width:100%;padding:11px;border:0;border-radius:8px;background:#0284c7;color:#fff;font:600 15px system-ui;cursor:pointer}.e{color:#fca5a5;min-height:20px}a{color:#7dd3fc}li{margin:6px 0}</style>
<form id=f><h1>Balcão Fácil – Primeiro acesso</h1><p style="margin:0 0 14px;color:#94a3b8">Crie o usuário administrador. Depois, os demais usuários são criados em Configurações.</p>
<label>Nome do administrador<input id=u value=admin autocomplete=username></label><label>Senha (mínimo 6 caracteres)<input id=p type=password autocomplete=new-password autofocus></label>
<label>Repita a senha<input id=p2 type=password autocomplete=new-password></label><div class=e id=e></div><button>Criar administrador e entrar</button></form>
<script>f.onsubmit=async function(ev){ev.preventDefault();if(p.value!==p2.value){e.textContent="As senhas não conferem.";return}var r=await fetch("/api/setup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u.value,pass:p.value})});if(r.ok)location.href="/";else e.textContent=(await r.json()).error}</script>
