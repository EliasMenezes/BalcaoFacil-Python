<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Usuários</title><style>body{font:15px system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:grid;place-items:center;min-height:100vh;margin:0}form,.b{background:#1e293b;padding:28px;border-radius:12px;width:min(92vw,360px)}h1{margin:0 0 16px;font-size:20px}input,select{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;font:inherit}button{width:100%;padding:11px;border:0;border-radius:8px;background:#0284c7;color:#fff;font:600 15px system-ui;cursor:pointer}.e{color:#fca5a5;min-height:20px}a{color:#7dd3fc}li{margin:6px 0}</style>
<div class=b style="width:min(94vw,460px)"><h1>Usuários</h1><ul id=l></ul><hr style="border-color:#334155"><label>Nome<input id=n></label><label>Senha (mín. 4)<input id=p type=password></label>
<label>Perfil<select id=r><option value=caixa>Caixa</option><option value=estoquista>Estoquista</option><option value=financeiro>Financeiro</option><option value=admin>Administrador</option></select></label><div class=e id=e></div><button id=s>Salvar / redefinir senha</button><p><a href="/">← Voltar ao PDV</a></p></div>
<script>async function api(b){var r=await fetch("/api/users",b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{});return r.json()}
async function load(){var us=await api();l.innerHTML="";us.forEach(function(x){var li=document.createElement("li");li.textContent=x.name+" ("+x.role+") ";var a=document.createElement("a");a.href="#";a.textContent="remover";a.onclick=async function(ev){ev.preventDefault();if(confirm("Remover "+x.name+"?")){await api({del:x.name});load()}};li.appendChild(a);l.appendChild(li)})}
s.onclick=async function(){var o=await api({name:n.value.trim(),pass:p.value,role:r.value});e.textContent=o.error||"";if(!o.error){n.value=p.value="";load()}};load()</script>
